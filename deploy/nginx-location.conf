# Include INSIDE your existing HTTPS server { } block, replacing its location /.
# Keep your real server_name, ssl_certificate, and ssl_certificate_key on host.
# If using a CDN, configure set_real_ip_from for ONLY that CDN before this snippet.
client_max_body_size 12m;
add_header Strict-Transport-Security "max-age=31536000" always;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    # Overwrite incoming identity; Nuxt signs this for the private API.
    proxy_set_header X-Gavin-Edge-Client-IP $remote_addr;
    proxy_set_header X-Gavin-Client-IP "";
    proxy_set_header X-Gavin-Client-IP-Timestamp "";
    proxy_set_header X-Gavin-Client-IP-Signature "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
