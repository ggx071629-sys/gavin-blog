[project]
name = "gavin-local-embedding"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.0",
  "uvicorn==0.35.0",
  "sentence-transformers==5.1.0",
  "transformers==4.56.2",
  "tokenizers==0.22.0",
  "torch==2.8.0+cpu",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
