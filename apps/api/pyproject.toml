[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gavin-api"
version = "0.1.0"
description = "FastAPI backend for the Gavin knowledge publication."
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-text-splitters>=1,<2",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langsmith>=0.3,<1",
  "pillow>=11.3,<13",
  "pydantic-settings>=2.10,<3",
  "pypdf==6.18.0",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "qdrant-client>=1.12,<2",
  "sqlalchemy>=2.0,<3",
  "tokenizers==0.22.0",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["app"]
python_version = "3.11"
# Pin to the CI/deployment platform so platform-guarded stdlib imports
# (msvcrt vs fcntl) type-check deterministically on any dev OS.
platform = "linux"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "types-pyyaml>=6.0.12.20260815",
]
